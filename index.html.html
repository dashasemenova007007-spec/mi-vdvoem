<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мы вдвоём</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FBF1E4">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: телефонный экран 480px по центру; кремовый фон, цветные «облачные» плитки с чёрно-бордовой обводкой, плавающая нижняя навигация-пилюля. */
:root{
  --bg:#FBF1E4; --card:#FFFAF2; --ink:#4A1422; --ink2:#8A6169; --line:rgba(74,20,34,.14); --glass:rgba(255,255,255,.55);
  --pink-bg:#FAD2E1; --pink-ink:#770523;
  --blue-bg:#C3D7EF; --blue-ink:#5C202E;
  --green-bg:#2E8B5F; --green-ink:#FFF4E0;
  --coral-bg:#F7B49D; --coral-ink:#5C202E;
  --pist-bg:#D6DE9B; --pist-ink:#4A1422;
  --cream-bg:#FFE9C7; --cream-ink:#C93D18;
  --red-bg:#DD4E28; --red-ink:#FFEDEF;
  --wine-bg:#5C202E; --wine-ink:#FAD2E1;
  --accent:#2E8B5F; --accent-ink:#FFF4E0; --hot:#E5126B; --star:#F2A81D;
  --pa:#F9B9B8; --pb:#9BB1D0;
  --display:'Unbounded','Onest',system-ui,sans-serif; --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#25101A; --card:#34182A; --ink:#FFEDE0; --ink2:#C9A3AE; --line:rgba(255,237,224,.18); --glass:rgba(0,0,0,.22);
  --pink-bg:#5E2539; --pink-ink:#FAD2E1; --blue-bg:#2B3B5C; --blue-ink:#D3E3F7; --green-bg:#1F6B47; --green-ink:#EAFFF2;
  --coral-bg:#6E3328; --coral-ink:#FFD2C2; --pist-bg:#4C5120; --pist-ink:#E8EFB5; --cream-bg:#43271F; --cream-ink:#FFC9A6;
  --red-bg:#B53F1E; --red-ink:#FFF1EE; --wine-bg:#4B1427; --wine-ink:#FAD2E1; --accent:#2E8B5F; --accent-ink:#F4FFF8; --star:#F6B73C;
  --pa:#C97F8E; --pb:#6F89B3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#25101A; --card:#34182A; --ink:#FFEDE0; --ink2:#C9A3AE; --line:rgba(255,237,224,.18); --glass:rgba(0,0,0,.22);
  --pink-bg:#5E2539; --pink-ink:#FAD2E1; --blue-bg:#2B3B5C; --blue-ink:#D3E3F7; --green-bg:#1F6B47; --green-ink:#EAFFF2;
  --coral-bg:#6E3328; --coral-ink:#FFD2C2; --pist-bg:#4C5120; --pist-ink:#E8EFB5; --cream-bg:#43271F; --cream-ink:#FFC9A6;
  --red-bg:#B53F1E; --red-ink:#FFF1EE; --wine-bg:#4B1427; --wine-ink:#FAD2E1; --accent:#2E8B5F; --accent-ink:#F4FFF8; --star:#F6B73C;
  --pa:#C97F8E; --pb:#6F89B3; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 var(--body);padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
img{max-width:100%}
#app{max-width:480px;margin:0 auto;padding-bottom:140px}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 10px}
.ttl{flex:1;min-width:0}
.ttl h1{font:800 24px/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance}
.ttl p,.eyebrow{font-size:13px;color:var(--ink2);margin-top:4px}
.eyebrow{margin:0 0 4px;text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:700}
.ic{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;flex:none;padding:0}
.ic svg{width:20px;height:20px}
.coinpill{border:2px solid var(--ink);background:var(--cream-bg);color:var(--cream-ink);border-radius:99px;padding:8px 14px;font:700 14px var(--display);flex:none}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:12px 22px;font-weight:700;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.pink{background:var(--pink-bg);color:var(--pink-ink)}
.btn.sm{padding:8px 16px;font-size:14px}
.btn.block{width:100%}
.btn.danger{color:var(--hot)}
.btn:focus-visible,.chip:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.chip{border:1.5px solid var(--ink);background:transparent;border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.chip.stk{padding:4px;width:52px;height:52px;display:grid;place-items:center;font-size:26px}
.chip.stk img{width:42px;height:42px;object-fit:contain}

/* карточки */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:16px;margin-bottom:12px;position:relative}
.tile{border-radius:28px;padding:18px;background:var(--bg-t);color:var(--ink-t);position:relative;overflow:hidden;border:0;text-align:left;width:100%;margin-bottom:12px}
.t-pink{--bg-t:var(--pink-bg);--ink-t:var(--pink-ink)}.t-blue{--bg-t:var(--blue-bg);--ink-t:var(--blue-ink)}
.t-green{--bg-t:var(--green-bg);--ink-t:var(--green-ink)}.t-coral{--bg-t:var(--coral-bg);--ink-t:var(--coral-ink)}
.t-pist{--bg-t:var(--pist-bg);--ink-t:var(--pist-ink)}.t-cream{--bg-t:var(--cream-bg);--ink-t:var(--cream-ink)}
.t-red{--bg-t:var(--red-bg);--ink-t:var(--red-ink)}.t-wine{--bg-t:var(--wine-bg);--ink-t:var(--wine-ink)}
.pop{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.tile .sp{position:absolute;right:16px;top:14px;opacity:.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid2 .tile{margin:0;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:132px;cursor:pointer}
.tile h3{font:800 16px/1.15 var(--display)}
.tile small{display:block;opacity:.85;font-size:13px;margin-top:3px;font-weight:600}
.gl{width:46px;height:46px;border-radius:50%;background:var(--glass);display:grid;place-items:center;font-size:25px}
.sec{font:800 14px var(--display);letter-spacing:.02em;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
.sec .sp{color:var(--hot)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.band{overflow:hidden;white-space:nowrap;background:var(--pist-bg);color:var(--pist-ink);border-radius:99px;padding:9px 0;font:700 12px var(--display);letter-spacing:.14em;margin:4px 0 16px;border:2px solid var(--ink)}
.band div{display:inline-block;animation:slide 26s linear infinite}
.band span{margin:0 14px}
@keyframes slide{to{transform:translateX(-50%)}}
.bar{height:14px;border-radius:99px;background:var(--glass);overflow:hidden;border:1.5px solid currentColor;margin:6px 0}
.bar i{display:block;height:100%;background:var(--hot);border-radius:99px;transition:width .5s}
.bar.g i{background:var(--accent)}
.row{display:flex;align-items:center;gap:10px}
.row.sp-b{justify-content:space-between}
.muted{color:var(--ink2);font-size:13px}
.empty{text-align:center;padding:30px 18px;color:var(--ink2)}
.empty .big{font-size:46px;margin-bottom:6px}
.empty p{margin-bottom:14px;text-wrap:balance}
.av{--s:26px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;font:800 calc(var(--s)*.46) var(--display);border:1.5px solid var(--ink);color:#4A1422;flex:none}
.av.a{background:var(--pa)}.av.b{background:var(--pb)}.av.both{background:var(--pist-bg)}

/* строки-списки */
.row-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:12px 14px;margin-bottom:10px}
.row-card.done .rc-main b{text-decoration:line-through;opacity:.55}
.rc-main{flex:1;min-width:0;cursor:pointer}
.rc-main b{display:block;font-weight:700;overflow-wrap:anywhere}
.rc-main small{color:var(--ink2);font-size:12.5px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:transparent;display:grid;place-items:center;flex:none;padding:0;color:var(--accent-ink)}
.chk.on{background:var(--accent)}
.chk svg{width:16px;height:16px;stroke-width:3}
.coin{font:700 13px var(--display);background:var(--cream-bg);color:var(--cream-ink);padding:5px 10px;border-radius:99px;white-space:nowrap}
.seg{display:flex;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:4px;gap:2px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:8px 10px;font-weight:700;font-size:13.5px;white-space:nowrap;color:var(--ink2)}
.seg button.on{background:var(--pink-bg);color:var(--pink-ink)}
.addrow{display:flex;gap:8px;margin-bottom:14px}
.addrow input{flex:1;min-width:0}
input,textarea{width:100%;border:2px solid var(--ink);background:var(--card);border-radius:20px;padding:12px 16px;outline:none}
textarea{resize:vertical;line-height:1.4}
input::placeholder,textarea::placeholder{color:var(--ink2);opacity:.8}
input[type=date],input[type=time]{min-height:48px}
.fab{position:fixed;right:max(16px,calc((100% - 480px)/2 + 16px));bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:15;width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);background:var(--hot);color:#fff;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0}
.fab svg{width:28px;height:28px;stroke-width:3}
.fab:active{transform:translateY(3px);box-shadow:none}

/* нижняя навигация */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.nav-in{max-width:480px;margin:0 auto;pointer-events:auto;display:flex;background:var(--card);border:2px solid var(--ink);border-radius:32px;box-shadow:0 4px 0 var(--ink);padding:5px}
.nb{flex:1;display:grid;justify-items:center;gap:1px;padding:7px 0 6px;border-radius:26px;font-size:11px;font-weight:700;color:var(--ink2);background:none;border:0}
.nb.on{background:var(--pink-bg);color:var(--pink-ink)}
.nb svg{width:23px;height:23px}
body.noNav .nav{display:none}

/* питомец */
.petcard{display:grid;grid-template-columns:150px 1fr;gap:6px;align-items:center;padding:14px 16px}
.petbox{position:relative;display:grid;place-items:center;cursor:pointer}
.petbox svg{width:100%;height:auto;overflow:visible}
.pet-big{max-width:260px;margin:0 auto}
.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:120px 232px}
@keyframes bob{50%{transform:translateY(-5px) scale(1.01,.985)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.6s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(12deg)}}
.zz{animation:zz 2.4s ease-in-out infinite}
@keyframes zz{50%{transform:translate(4px,-8px);opacity:.4}}
.petbox.jump .bob{animation:jump .5s}
@keyframes jump{40%{transform:translateY(-20px) scale(1.03,.97)}}
.heart{position:absolute;pointer-events:none;animation:floatUp 1.3s ease-out forwards;font-size:24px}
@keyframes floatUp{to{transform:translateY(-90px) rotate(var(--r,0deg));opacity:0}}
.food{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:10px 14px;margin-bottom:8px;text-align:left}
.food .e{font-size:30px}
.food b{flex:1}
.outfits{display:flex;gap:8px;flex-wrap:wrap}
.chip.lock{opacity:.45}

/* настроение */
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.moodb{border:1.5px solid var(--ink);background:var(--card);border-radius:20px;padding:8px 2px;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700}
.moodb span{font-size:28px;line-height:1.1}
.moodb.on{background:var(--pink-bg);color:var(--pink-ink);box-shadow:0 3px 0 var(--ink)}
.mday{display:grid;grid-template-columns:62px 1fr 1fr;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.mday .e{font-size:24px;text-align:center}

/* календарь */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.cal .dw{text-align:center;font-size:11px;font-weight:700;color:var(--ink2);padding:4px 0}
.cell{aspect-ratio:1;border-radius:16px;border:1.5px solid transparent;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:14px;padding:0}
.cell.off{background:none;pointer-events:none}
.cell.today{border-color:var(--hot);color:var(--hot)}
.cell.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--hot)}
.dots i.d2{background:var(--accent)}.dots i.d3{background:var(--star)}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mhead h2{font:800 18px var(--display)}

/* меню ресторана */
.resto{text-align:center;padding:26px 18px 22px}
.resto .big{font:800 44px/1 var(--display);letter-spacing:.04em}
.resto .nm{font:600 15px var(--body);letter-spacing:.2em;text-transform:uppercase;margin-top:10px}
.resto .sub{opacity:.85;font-size:13px;margin-top:6px}
.cat{font:800 13px var(--display);letter-spacing:.18em;text-transform:uppercase;margin:24px 0 8px;display:flex;align-items:center;gap:10px;color:var(--hot)}
.cat::after{content:"";flex:1;border-top:2px solid currentColor;opacity:.4}
.dish{display:block;width:100%;background:none;border:0;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.dl{display:flex;align-items:baseline;gap:8px}
.dl b{font:700 17px var(--display);letter-spacing:-.01em}
.dl .dots2{flex:1;border-bottom:2px dotted var(--ink2);transform:translateY(-4px);min-width:16px;opacity:.6}
.dl .rt{font-weight:800;white-space:nowrap}
.stars{color:var(--star);letter-spacing:1px}
.stars .e{color:var(--line)}
.dish small{color:var(--ink2);font-size:13px}
.starrow{display:flex;gap:2px}
.starrow button{background:none;border:0;font-size:30px;line-height:1;padding:2px;color:var(--line)}
.starrow button.on{color:var(--star)}
.hero{border-radius:28px;overflow:hidden;aspect-ratio:16/10;background:var(--pink-bg);display:grid;place-items:center;font-size:64px;margin-bottom:14px;border:2px solid var(--ink)}
.hero img{width:100%;height:100%;object-fit:cover}
.cloud{clip-path:url(#cloud);border:0;border-radius:0;aspect-ratio:1;width:70%;margin:0 auto 14px}
.ing li,.steps li{margin-bottom:6px}
.ing{list-style:none;padding:0;margin:0}
.ing li::before{content:"✦";color:var(--hot);margin-right:8px}
.steps{padding-left:22px;margin:0}
.steps li::marker{font-weight:800;color:var(--hot)}
.note{background:var(--cream-bg);color:var(--ink);border-radius:18px 18px 18px 4px;padding:10px 14px;margin-bottom:8px}
.note.me{background:var(--pink-bg);border-radius:18px 18px 4px 18px;margin-left:30px}
.note small{display:block;opacity:.7;font-size:11.5px}
.note,.note.me{color:#4A1422}

/* галерея */
.masonry{columns:2;column-gap:10px}
.ph{break-inside:avoid;margin:0 0 10px;border-radius:26px;overflow:hidden;border:2px solid var(--ink);position:relative;display:block;width:100%;padding:0;background:var(--pink-bg)}
.ph:nth-child(3n+2){border-radius:40px 12px 40px 12px}
.ph:nth-child(4n){border-radius:12px 40px 12px 40px}
.ph img{display:block;width:100%;height:auto}
.ph .fv{position:absolute;right:8px;top:8px;background:var(--card);border-radius:99px;padding:2px 7px;font-size:14px}
.ph.noimg{aspect-ratio:1;display:grid;place-items:center;font-size:30px}
.viewer img{width:100%;border-radius:22px;border:2px solid var(--ink);margin-bottom:12px}

/* стикеры, записки */
.stkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stkcell{background:var(--card);border:1.5px dashed var(--ink2);border-radius:22px;aspect-ratio:1;display:grid;place-items:center;padding:8px;position:relative}
.stkcell img{width:100%;height:100%;object-fit:contain}
.stkcell button{position:absolute;inset:0;background:none;border:0}
.stk{width:90px;height:90px;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(74,20,34,.18))}
.paper{border-radius:6px 22px 8px 22px;padding:16px 16px 14px;margin-bottom:16px;transform:rotate(var(--rot,-1deg));box-shadow:3px 4px 0 rgba(74,20,34,.16);position:relative;background:var(--bg-t);color:var(--ink-t)}
.paper:nth-child(even){--rot:1.2deg}
.paper p{font:600 17px/1.35 var(--body);white-space:pre-wrap;overflow-wrap:anywhere}
.paper .meta{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;margin-bottom:8px;opacity:.9}
.paper .stk{position:absolute;right:8px;bottom:-14px;transform:rotate(8deg)}
.paper .emo{font-size:52px;position:absolute;right:10px;bottom:-12px;transform:rotate(8deg)}
.paper.new::before{content:"новая";position:absolute;top:-8px;right:12px;background:var(--hot);color:#fff;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:800}
.studio canvas{width:100%;max-width:300px;aspect-ratio:1;display:block;margin:0 auto 12px;border-radius:26px;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 50%/20px 20px}

/* копилка и поездки */
.jar{width:130px;flex:none}
.goal{display:flex;gap:14px;align-items:center;cursor:pointer}
.sumbig{font:800 28px/1 var(--display)}
.tripcard{display:block;width:100%;text-align:left}
.tripcard .e{font-size:40px}
.tripcard h3{font-size:19px;margin:6px 0 2px}
.pill{display:inline-block;background:var(--glass);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}

/* уровни */
.lvrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.lvrow.cur{color:var(--hot)}.lvrow.lock{opacity:.5}
.lvrow .n{font:800 14px var(--display);width:30px}
.lvrow .e{font-size:26px}
.lvrow small{display:block;color:var(--ink2)}
.xpl li{margin-bottom:5px}
.xpl{margin:0;padding-left:18px}

/* шторка, тост */
#sheetwrap{position:fixed;inset:0;z-index:50;display:none}
#sheetwrap.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(40,10,20,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg);border:2px solid var(--ink);border-bottom:0;border-radius:32px 32px 0 0;max-height:90%;overflow-y:auto;padding:12px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sh-t{font:800 20px var(--display);margin-bottom:14px;letter-spacing:-.01em}
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px 4px}
.sh-btns{display:flex;gap:10px;margin-top:18px}
.sh-btns .btn{flex:1}

<div id="toast" role="status"></div>
<script>
'use strict';
const VIEWS={},ACT={},UI={};
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const uid=()=>Math.random().toString(36).slice(2,8)+now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pdate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)};
const dayDiff=(a,b)=>Math.round((pdate(b)-pdate(a))/864e5);
const addDays=(k,n)=>{const d=pdate(k);d.setDate(d.getDate()+n);return dkey(d)};
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const fdate=(k,y)=>{const d=pdate(k);return d.getDate()+' '+MON[d.getMonth()]+(y?' '+d.getFullYear():'')};
const plural=(n,f)=>{n=Math.abs(n);const a=n%10,b=n%100;return f[b>10&&b<20?2:a===1?0:a>1&&a<5?1:2]};
const pl=(n,f)=>n+' '+plural(n,f);
const money=n=>Math.round(n).toLocaleString('ru-RU')+' '+cfg().cur;
const weekStart=k=>{const d=pdate(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d)};
const inDays=k=>{const n=dayDiff(dkey(),k);return n===0?'сегодня':n===1?'завтра':n<0?pl(-n,['день','дня','дней'])+' назад':'через '+pl(n,['день','дня','дней'])};

/* ---------- хранилище ---------- */
let S={items:{}},saveT,ME='a';
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const idb=(()=>{let db;const open=()=>new Promise((res,rej)=>{try{const r=indexedDB.open('us-app',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
  return{async get(k){db=db||await open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){db=db||await open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}}})();
async function load(){
  try{const v=await Promise.race([idb.get('state'),new Promise((_,r)=>setTimeout(r,1500))]);if(v&&v.items){S=v;return}}catch(e){}
  try{const v=JSON.parse(LS.get('us.state')||'null');if(v&&v.items)S=v}catch(e){}
}
function save(){clearTimeout(saveT);saveT=setTimeout(async()=>{try{await idb.set('state',S)}catch(e){try{LS.set('us.state',JSON.stringify(S))}catch(e2){}}},300)}
function put(type,o){const id=o.id||uid();const p=S.items[id]&&!S.items[id].del?S.items[id]:{};S.items[id]={...p,...o,id,type,u:now(),c:p.c||now()};save();return S.items[id]}
function del(id){const p=S.items[id];if(!p)return;S.items[id]={id,type:p.type,del:1,u:now()};save()}
const all=t=>Object.values(S.items).filter(x=>x.type===t&&!x.del);
const get=id=>{const x=S.items[id];return x&&!x.del?x:null};
const CFG0={a:'Он',b:'Она',since:'',resto:'У нас дома',cur:'₽',pet:'cat',petName:'Пушок',outfit:'none',ready:false};
const cfg=()=>({...CFG0,...(get('cfg')||{})});
const setCfg=o=>put('cfg',{...o,id:'cfg'});
const OT=()=>ME==='a'?'b':'a';
const nm=w=>w==='both'?'Оба':(cfg()[w]||'?');
const av=(w,s=26)=>w==='both'?`<span class="av both" style="--s:${s}px">♥</span>`:`<span class="av ${w}" style="--s:${s}px">${esc((nm(w)||'?')[0].toUpperCase())}</span>`;

/* ---------- иконки ---------- */
const IC={
  home:'<path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="4"/><path d="M8 3v4M16 3v4M4 10h16"/>',
  menu:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 5-3.5 8H17"/>',
  photo:'<rect x="3.5" y="5" width="17" height="15" rx="4"/><circle cx="9" cy="11" r="2"/><path d="m4 18 5-4 3 2.5 3-3 5 4"/>',
  more:'<circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><circle cx="12" cy="12" r="2"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  next:'<path d="m9 5 7 7-7 7"/>'
};
const ico=(n,s=24)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const spark=(c='currentColor',s=18)=>`<svg class="sp" viewBox="0 0 24 24" width="${s}" height="${s}" aria-hidden="true"><path fill="${c}" d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z"/></svg>`;

/* ---------- Telegram ---------- */
const TG=()=>window.Telegram&&window.Telegram.WebApp;
function buzz(){try{TG()&&TG().HapticFeedback&&TG().HapticFeedback.impactOccurred('light')}catch(e){}}
function setupTG(){const t=TG();if(!t)return;try{t.ready();t.expand();t.disableVerticalSwipes&&t.disableVerticalSwipes();const bg=getComputedStyle(document.body).backgroundColor;const h=bg.match(/\d+/g).slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join('');t.setHeaderColor&&t.setHeaderColor('#'+h);t.setBackgroundColor&&t.setBackgroundColor('#'+h);t.BackButton.onClick(back)}catch(e){}}
function initTG(){const inTG=/tgWebApp/.test(location.hash+location.search);if(inTG&&!TG()){const s=document.createElement('script');s.src='https://telegram.org/js/telegram-web-app.js';s.onload=setupTG;document.head.appendChild(s)}else setupTG()}

/* ---------- интерфейс ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2300)}
function burst(list=['✨','💖','🎉','⭐','🍓']){const w=document.createElement('div');w.className='burst';for(let i=0;i<28;i++){const s=document.createElement('span');s.textContent=list[i%list.length];s.style.cssText=`left:${Math.random()*100}%;animation-delay:${Math.random()*.5}s;font-size:${16+Math.random()*20}px`;w.appendChild(s)}document.body.appendChild(w);setTimeout(()=>w.remove(),3000)}
function openSheet(html){$('#sheetbody').innerHTML=html;$('#sheetwrap').classList.add('open');$('#sheet').scrollTop=0}
function closeSheet(){$('#sheetwrap').classList.remove('open');$('#sheetbody').innerHTML=''}
ACT.closeSheet=closeSheet;

async function fileToImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u})}
async function resize(file,max=900,q=.82){const i=await fileToImg(file);const s=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(i.src);return c.toDataURL('image/jpeg',q)}

/* универсальная форма в шторке */
function form(o){
  const v={...(o.vals||{})};
  o.fields.forEach(f=>{if(f.t==='chips'&&v[f.k]===undefined)v[f.k]=f.opts[0][0]});
  const fld=f=>{const id='f_'+f.k;let inp='';
    if(f.t==='area')inp=`<textarea id="${id}" rows="${f.rows||4}" placeholder="${esc(f.ph||'')}">${esc(v[f.k]||'')}</textarea>`;
    else if(f.t==='chips')inp=`<div class="chips" data-chips="${f.k}">${f.opts.map(([val,lab,raw])=>`<button type="button" class="chip${f.stk?' stk':''}${String(v[f.k]??'')===String(val)?' on':''}" data-v="${esc(val)}">${raw?lab:esc(lab)}</button>`).join('')}</div>`;
    else if(f.t==='photo')inp=`<div class="pickph" data-photo="${f.k}"><div class="pv" style="${v[f.k]?`background-image:url(${v[f.k]})`:''}"></div><label class="btn ghost sm">Выбрать фото<input type="file" accept="image/*" hidden></label></div>`;
    else inp=`<input id="${id}" type="${f.t==='num'?'text':f.t||'text'}" ${f.t==='num'?'inputmode="decimal"':''} placeholder="${esc(f.ph||'')}" value="${esc(v[f.k]??'')}">`;
    return `<div class="fld"><label for="${id}">${esc(f.label)}</label>${inp}</div>`};
  openSheet(`<h2 class="sh-t">${esc(o.title)}</h2>${o.fields.map(fld).join('')}<div class="sh-btns">${o.onDelete?'<button class="btn ghost danger" id="shDel">Удалить</button>':''}<button class="btn" id="shOk">${o.ok||'Сохранить'}</button></div>`);
  const sh=$('#sheetbody');
  $$('[data-chips]',sh).forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;$$('.chip',g).forEach(x=>x.classList.remove('on'));b.classList.add('on');v[g.dataset.chips]=b.dataset.v}));
  $$('[data-photo]',sh).forEach(g=>{const f=o.fields.find(x=>x.k===g.dataset.photo);$('input',g).addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{v[f.k]=await resize(file,f.max||900);$('.pv',g).style.backgroundImage=`url(${v[f.k]})`}catch(err){toast('Не получилось открыть фото')}})});
  $('#shOk').onclick=async()=>{
    const out={...v};
    o.fields.forEach(f=>{if(f.t==='chips'||f.t==='photo')return;let x=($('#f_'+f.k,sh).value||'').trim();if(f.t==='num')x=parseFloat(x.replace(',','.').replace(/\s/g,''))||0;out[f.k]=x});
    if(o.req){const f=o.fields.find(x=>x.k===o.req);if(!out[o.req]){toast('Заполни «'+f.label+'»');return}}
    const r=await o.onSave(out);if(r!==false){closeSheet();render()}};
  if(o.onDelete){const d=$('#shDel');d.onclick=()=>{if(!d.dataset.s){d.dataset.s=1;d.textContent='Точно удалить?';return}o.onDelete();closeSheet();render()}}
}

/* ---------- навигация ---------- */
let stack=[{v:'home',p:{}}];
const cur=()=>stack[stack.length-1];
function go(v,p={}){stack.push({v,p});render(true)}
function root(v){stack=[{v,p:{}}];render(true)}
function back(){if(stack.length>1){stack.pop();render(true)}}
ACT.back=back;
ACT.go=el=>go(el.dataset.v,{id:el.dataset.id,tab:el.dataset.tab});
ACT.root=el=>root(el.dataset.v);
const TABS=[['home','Главная','home'],['cal','Планы','cal'],['menu','Меню','menu'],['gallery','Фото','photo'],['more','Ещё','more']];
function hdr(title,o={}){return `<header class="top">${stack.length>1&&!o.noback?`<button class="ic" data-act="back" aria-label="Назад">${ico('back')}</button>`:''}<div class="ttl"><h1>${title}</h1>${o.sub?`<p>${o.sub}</p>`:''}</div>${o.right||''}</header>`}
const fab=act=>`<button class="fab" data-act="${act}" aria-label="Добавить">${ico('plus')}</button>`;
const empty=(e,t,b)=>`<div class="empty"><div class="big">${e}</div><p>${t}</p>${b||''}</div>`;
function render(topScroll){
  const y=topScroll?0:window.scrollY;const c=cur();
  const onb=c.v==='onb';document.body.classList.toggle('noNav',onb);
  $('#app').innerHTML=(VIEWS[c.v]||VIEWS.home)(c.p||{});
  $('#nav').innerHTML=TABS.map(([v,l,i])=>`<button class="nb${stack[0].v===v?' on':''}" data-act="root" data-v="${v}">${ico(i)}<span>${l}</span></button>`).join('');
  window.scrollTo(0,y);
  try{const t=TG();if(t){stack.length>1?t.BackButton.show():t.BackButton.hide()}}catch(e){}
  if(VIEWS[c.v]&&VIEWS[c.v].after)VIEWS[c.v].after(c.p||{});
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();buzz();f(el,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter&&e.target.tagName==='INPUT'){const b=$(e.target.dataset.enter);b&&b.click()}});

/* ---------- уровни, монеты, питомец ---------- */
const LV=[[0,'Первое свидание','🌱'],[30,'Кофе на двоих','☕'],[80,'Общий плейлист','🎧'],[150,'Зубные щётки рядом','🪥'],[250,'Один плед на двоих','🧣'],[380,'Свои шутки на двоих','😹'],[550,'Общий холодильник','🧊'],[760,'Дом там, где ты','🏡'],[1000,'Планы на всю жизнь','🗺️'],[1300,'Love · максимальный уровень','👑']];
const OUTFITS=[['none','Без наряда',1],['bow','Бантик',1],['scarf','Шарфик',2],['glasses','Очки',4],['crown','Корона',6],['wings','Крылышки',9]];
const FOODS=[['🍪','Печенька',3,15],['🍓','Клубничка',4,18],['🍣','Суши',8,30],['🍰','Тортик',10,40],['🍕','Пицца',12,50]];
const MOODS=[['love','🥰','любовь'],['joy','😊','радость'],['calm','😌','спокойно'],['sleepy','🥱','сонно'],['tired','😵‍💫','устал(а)'],['sad','🥺','грустно'],['angry','😤','бесит'],['sick','🤒','болею']];
const moodE=k=>(MOODS.find(m=>m[0]===k)||[0,'·'])[1];

function totals(){const r={c:0,x:0,by:{a:{c:0,x:0},b:{c:0,x:0}}};all('tx').forEach(t=>{r.c+=t.coins||0;r.x+=t.x||0;const b=r.by[t.who];if(b){if(t.coins>0)b.c+=t.coins;b.x+=t.x||0}});return r}
function lvl(xp){if(xp===undefined)xp=totals().x;let n=0;LV.forEach((l,i)=>{if(xp>=l[0])n=i});const c=LV[n],x=LV[n+1];return{n:n+1,name:c[1],ico:c[2],xp,from:c[0],to:x?x[0]:null,pct:x?Math.round((xp-c[0])/(x[0]-c[0])*100):100}}
let QUIET=false;
function award(key,{c=0,x=0,why='',who=ME}={}){
  const id='tx-'+key,ex=S.items[id];if(ex&&!ex.del)return false;
  const before=lvl().n;put('tx',{id,coins:c,x,why,who,day:dkey(),t:now()});
  if(QUIET)return true;const b=[];if(c)b.push((c>0?'+':'')+c+' 🪙');if(x)b.push('+'+x+' XP');toast(b.join('  ')+(why?' · '+why:''));
  const a=lvl();if(a.n>before)setTimeout(()=>levelUp(a),900);return true}
function levelUp(a){burst();const un=OUTFITS.filter(o=>o[2]===a.n&&o[2]>1).map(o=>o[1]);
  openSheet(`<div style="text-align:center"><div style="font-size:64px">${a.ico}</div><p class="lbl">Новый уровень ${a.n}</p><h2 class="sh-t" style="margin-top:6px">${esc(a.name)}</h2><p class="muted" style="margin-bottom:14px">Ваши отношения растут!${un.length?'<br>Для питомца открылось: <b>'+un.join(', ')+'</b>':''}</p><button class="btn block" data-act="closeSheet">Ура!</button></div>`)}

/* сытость питомца считается по журналу кормлений */
function satiety(){const c=get('cfg');let t0=(c&&c.c)||now(),s=70;const R=2.5/36e5;
  all('feed').sort((a,b)=>a.t-b.t).forEach(f=>{s=Math.max(0,s-(f.t-t0)*R)+f.amt;s=Math.min(100,s);t0=f.t});
  return Math.round(Math.max(0,s-(now()-t0)*R))}
function petMood(){const s=satiety(),h=new Date().getHours();if(s<25)return'hungry';if(h>=23||h<7)return'sleepy';return s>=55?'happy':'normal'}
function feed(i){const f=FOODS[i];if(totals().c<f[2]){toast('Не хватает монеток — сделайте дело 🧹');return}
  const id=uid();put('feed',{id:'feed-'+id,amt:f[3],t:now(),who:ME,emo:f[0]});award('feedtx-'+id,{c:-f[2],x:2,why:'Ням! '+f[0]});
  const b=$('.petbox');b&&(b.classList.add('jump'),setTimeout(()=>b.classList.remove('jump'),600));hearts(b);render()}
function hearts(box){if(!box)return;for(let i=0;i<5;i++){const h=document.createElement('span');h.className='heart';h.textContent=['💖','💗','✨','💕'][i%4];h.style.cssText=`left:${25+Math.random()*50}%;top:${20+Math.random()*30}%;--r:${Math.random()*40-20}deg;animation-delay:${i*.1}s`;box.appendChild(h);setTimeout(()=>h.remove(),1600)}}
ACT.pettap=el=>{el.classList.add('jump');setTimeout(()=>el.classList.remove('jump'),600);hearts(el)};

function petSVG(kind='cat',mood='happy',outfit='none'){
  const C={cat:{f:'#F6B58A',i:'#F9B9B8',b:'#FFE3CC'},bunny:{f:'#FCE4EC',i:'#F9A8C0',b:'#FFFFFF'},bear:{f:'#C98E5E',i:'#E8B98F',b:'#EBC9A2'}}[kind]||{f:'#F6B58A',i:'#F9B9B8',b:'#FFE3CC'};
  const K='#4A1422',st=`stroke="${K}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"`;
  let ears='',tail='';
  if(kind==='cat'){ears=`<path d="M62 94 L64 40 L108 70Z" fill="${C.f}" ${st}/><path d="M71 82 L72 56 L93 71Z" fill="${C.i}"/><path d="M178 94 L176 40 L132 70Z" fill="${C.f}" ${st}/><path d="M169 82 L168 56 L147 71Z" fill="${C.i}"/>`;
    tail=`<g class="tail"><path d="M168 205 Q220 200 212 150" fill="none" stroke="${K}" stroke-width="22" stroke-linecap="round"/><path d="M168 205 Q220 200 212 150" fill="none" stroke="${C.f}" stroke-width="15" stroke-linecap="round"/></g>`}

/* ---------- формы для стикеров и облачко ---------- */
function polar(f,N=140){const pts=[];for(let i=0;i<N;i++){const t=i/N*Math.PI*2,r=f(t);pts.push([Math.cos(t)*r,Math.sin(t)*r])}return pts}
const cloudR=t=>.8+.17*Math.abs(Math.sin(5*t));
function shapePath(k){const p=new Path2D();
  if(k==='circle')p.arc(0,0,1,0,7);
  else if(k==='heart')p.addPath(new Path2D('M0 .9 C-1.15 .1 -1 -.8 -.45 -.85 C-.18 -.85 0 -.65 0 -.5 C0 -.65 .18 -.85 .45 -.85 C1 -.8 1.15 .1 0 .9Z'));
  else if(k==='cloud'){polar(cloudR).forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y));p.closePath()}
  else if(k==='blob'){polar(t=>.86+.07*Math.cos(3*t)+.05*Math.sin(5*t+1)).forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y));p.closePath()}
  else if(k==='star'){p.addPath(new Path2D('M0 -1 C.1 -.34 .34 -.1 1 0 C.34 .1 .1 .34 0 1 C-.1 .34 -.34 .1 -1 0 C-.34 -.1 -.1 -.34 0 -1Z'))}
  else p.addPath(new Path2D('M-.62 -.92 H.62 Q.92 -.92 .92 -.62 V.62 Q.92 .92 .62 .92 H-.62 Q-.92 .92 -.92 .62 V-.62 Q-.92 -.92 -.62 -.92Z'));
  return p}
const cloudClipD=(()=>{const pts=polar(t=>.43+.07*Math.abs(Math.sin(5*t)),160);return pts.map(([x,y],i)=>(i?'L':'M')+(x+.5).toFixed(3)+' '+(y+.5).toFixed(3)).join('')+'Z'})();

async function drawSticker(c,o){
  const N=480;c.width=c.height=N;const g=c.getContext('2d');g.clearRect(0,0,N,N);
  try{await document.fonts.load('800 40px Unbounded')}catch(e){}
  const P=shapePath(o.shape||'circle'),R=N/2-14;
  g.save();g.translate(N/2,N/2);g.scale(R,R);g.shadowColor='rgba(74,20,34,.4)';g.shadowBlur=12;g.shadowOffsetY=5;g.fillStyle='#fff';g.fill(P);g.restore();
  g.save();g.translate(N/2,N/2);g.scale(R*.9,R*.9);g.clip(P);g.setTransform(1,0,0,1,0,0);
  g.fillStyle=o.bg||'#FAD2E1';g.fillRect(0,0,N,N);
  if(o.mode==='photo'&&o.img){const s=Math.max(N/o.img.width,N/o.img.height);const w=o.img.width*s,h=o.img.height*s;g.drawImage(o.img,(N-w)/2,(N-h)/2,w,h)}
  if(o.mode==='emoji'){g.font=`${N*.5}px "Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(o.emoji||'💖',N/2,N/2+(o.text?-N*.06:0))}
  g.restore();
  if(o.text){const lines=wrap(g,o.text.toUpperCase(),N*.74,o.mode==='text'?66:50);const fs=lines.fs;g.font=`800 ${fs}px Unbounded,"Onest",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
    const y0=o.mode==='text'?N/2-(lines.l.length-1)*fs*.6:N*.8-(lines.l.length-1)*fs*.6;
    lines.l.forEach((l,i)=>{const y=y0+i*fs*1.2;g.lineWidth=fs*.3;g.strokeStyle='#fff';g.strokeText(l,N/2,y);g.fillStyle=o.fg||'#770523';g.fillText(l,N/2,y)})}
}
function wrap(g,text,max,fs){g.font=`800 ${fs}px Unbounded,"Onest",sans-serif`;const words=text.split(/\s+/);let l=[],cur='';
  words.forEach(w=>{const t=cur?cur+' '+w:w;if(g.measureText(t).width>max&&cur){l.push(cur);cur=w}else cur=t});if(cur)l.push(cur);
  while(fs>22&&l.some(x=>(g.font=`800 ${fs}px Unbounded,"Onest",sans-serif`,g.measureText(x).width>max)))fs-=3;return{l,fs}}

/* ---------- синхронизация между двумя телефонами ---------- */
const MEDIA=['d','t','img','photo'];
function exportObj(media){const items={};Object.entries(S.items).forEach(([k,v])=>{if(!media&&!v.del&&MEDIA.some(m=>v[m])){const c={...v,nm:1};MEDIA.forEach(m=>delete c[m]);items[k]=c}else items[k]=v});return{app:'us',v:1,items}}
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pack(str){const raw=new TextEncoder().encode(str);if(window.CompressionStream){const cs=new CompressionStream('gzip');const w=cs.writable.getWriter();w.write(raw);w.close();return'US1.'+b64(new Uint8Array(await new Response(cs.readable).arrayBuffer()))}return'US0.'+b64(raw)}
async function unpack(code){code=code.trim();const k=code.slice(0,4),body=code.slice(4);let raw=unb64(body);
  if(k==='US1.'){const ds=new DecompressionStream('gzip');const w=ds.writable.getWriter();w.write(raw);w.close();raw=new Uint8Array(await new Response(ds.readable).arrayBuffer())}
  else if(k!=='US0.')throw new Error('bad');return new TextDecoder().decode(raw)}
function mergeIn(obj){if(!obj||obj.app!=='us'||!obj.items)throw new Error('bad');let n=0;
  Object.entries(obj.items).forEach(([id,inc])=>{const loc=S.items[id];if(loc&&loc.u>=inc.u)return;
    if(inc.nm&&loc)MEDIA.forEach(m=>{if(loc[m])inc[m]=loc[m]});S.items[id]=inc;n++});save();return n}
async function importText(txt){txt=txt.trim();const json=txt[0]==='{'?txt:await unpack(txt);return mergeIn(JSON.parse(json))}
async function saveFile(name,blob){try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Скопировано');return true}catch(e){return false}}

function allDates(){const c=cfg(),l=all('date').slice();if(c.since)l.push({id:'v-since',virtual:1,title:'Годовщина отношений',date:c.since,yearly:'1',emoji:'💞'});return l}
function nextOcc(d){const t=dkey();if(d.yearly==='0')return{k:d.date,years:0};const [y,m,dd]=d.date.split('-').map(Number),ty=new Date().getFullYear();let k=`${ty}-${pad(m)}-${pad(dd)}`;if(k<t)k=`${ty+1}-${pad(m)}-${pad(dd)}`;return{k,years:+k.slice(0,4)-y}}
function milestone(){const c=cfg();if(!c.since)return null;const n=dayDiff(c.since,dkey());const list=[];for(let i=100;i<=10000;i+=100)list.push(i);for(let y=1;y<=30;y++)list.push(Math.round(365.25*y));list.sort((a,b)=>a-b);const m=list.find(x=>x>n);return{n,m,k:addDays(c.since,m),prev:list.filter(x=>x<=n).pop()||0}}
function together(since){const a=pdate(since),b=new Date();let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;if(m<0){y--;m+=12}return(y?pl(y,['год','года','лет'])+' ':'')+(m||!y?pl(m,['месяц','месяца','месяцев']):'')}

function marks(y,m){const mk={},add=(k,t)=>{(mk[k]=mk[k]||new Set()).add(t)};const pre=`${y}-${pad(m+1)}-`;
  all('ev').forEach(e=>e.date.startsWith(pre)&&add(e.date,1));
  allDates().forEach(d=>{const [dy,dm,dd]=d.date.split('-');if(d.yearly==='0'?d.date.startsWith(pre):+dm===m+1)add(pre+dd,2)});
  all('trip').forEach(t=>{for(let k=t.start;k<=t.end&&k;k=addDays(k,1)){if(k.startsWith(pre))add(k,3);if(k>pre+'32')break}});return mk}

  ${trs.map(x=>`<div class="row-card"><span style="font-size:28px">${esc(x.emoji||'🧳')}</span><div class="rc-main" data-act="go" data-v="trip" data-id="${x.id}"><b>${esc(x.title)}</b><small>Поездка · ${fdate(x.start)} – ${fdate(x.end)}</small></div></div>`).join('')}

  ${!evs.length&&!ds.length&&!trs.length?'<p class="muted" style="text-align:center;padding:10px">В этот день планов нет</p>':''}${fab('evNew')}`};

function jar(pct,id='j'){const J='M30 34h60v8q12 6 12 22v52q0 18-18 18H36q-18 0-18-18V64q0-16 12-22z',h=Math.round(96*Math.min(1,pct)/1);return `<svg class="jar" viewBox="0 0 120 150" role="img" aria-label="Банка накоплений ${Math.round(pct*100)}%"><defs><clipPath id="${id}"><path d="${J}"/></clipPath></defs><path d="${J}" fill="rgba(255,255,255,.55)"/><g clip-path="url(#${id})"><rect x="0" y="${134-h}" width="120" height="${h+20}" fill="var(--hot)"/><circle cx="40" cy="${134-h+14}" r="5" fill="#F7C948"/><circle cx="68" cy="${134-h+22}" r="5" fill="#F7C948"/><circle cx="86" cy="${134-h+10}" r="4" fill="#F7C948"/></g><path d="${J}" fill="none" stroke="#4A1422" stroke-width="3.5" stroke-linejoin="round"/><rect x="26" y="16" width="68" height="18" rx="7" fill="#F7B49D" stroke="#4A1422" stroke-width="3.5"/></svg>`}

  return hdr('Уровни отношений',{sub:'Растите вместе, как в игре'})+
  `<div class="tile t-cream pop" style="text-align:center"><div style="font-size:56px">${L.ico}</div><div class="lbl">Уровень ${L.n}</div><h2 style="font:800 22px var(--display);margin:6px 0">${esc(L.name)}</h2><div class="bar"><i style="width:${L.pct}%"></i></div><small>${L.to?`${L.xp} / ${L.to} XP · ещё ${L.to-L.xp}`:'Максимальный уровень!'}</small></div>
  <div class="grid2" style="grid-template-columns:1fr 1fr">${stat.map(s=>`<div class="card" style="margin:0;text-align:center"><div style="font-size:26px">${s[0]}</div><b style="font:800 20px var(--display)">${s[1]}</b><div class="muted">${s[2]}</div></div>`).join('')}</div>
  <div class="sec">${spark(undefined,14)} Все уровни</div><div class="card">${LV.map((l,i)=>{const n=i+1,un=OUTFITS.filter(o=>o[2]===n&&n>1).map(o=>o[1]);return `<div class="lvrow${n===L.n?' cur':''}${n>L.n?' lock':''}"><span class="n">${n}</span><span class="e">${n>L.n?'🔒':l[2]}</span><div><b>${esc(l[1])}</b><small>от ${l[0]} XP${un.length?' · наряд: '+un.join(', '):''}</small></div></div>`}).join('')}</div>
  <div class="sec">${spark(undefined,14)} Как получать XP</div><div class="card"><ul class="xpl"><li>Домашние дела — по награде за дело</li><li>Приготовили блюдо: +10 XP и 5 монет</li><li>Исполнили хотелку: +8 XP</li><li>Новое блюдо в меню: +8 XP</li><li>Новая поездка: +6 XP</li><li>Записка, взнос в копилку: +5 XP</li><li>Настроение, фото, план, дата, оценка: +3 XP</li></ul></div>`};

/* ---------- ещё / настройки ---------- */
const MORE=[['chores','🧹','Домашние дела','монетки за дела'],['lists','🛒','Списки','покупки, хотелки, вкусняшки'],['notes','💌','Записки','милые послания'],['reminders','🔔','Напоминалки','для второй половинки'],['dates','🎂','Важные даты','годовщины и праздники'],['trips','🧳','Путешествия','маршруты и бюджет'],['piggy','🐷','Копилка','общие цели'],['stickers','🎀','Стикеры','свои, из фото'],['mood','🥰','Настроение','дни и история'],['pet','🐱','Питомец','кормить и наряжать'],['levels','👑','Уровни','растём вместе'],['settings','⚙️','Настройки и синхронизация','имена, тема, обмен данными']];
VIEWS.more=()=>hdr('Все разделы',{noback:1})+MORE.map(m=>`<button class="morerow" data-act="go" data-v="${m[0]}"><span class="gl">${m[1]}</span><div style="flex:1"><b>${m[2]}</b><small>${m[3]}</small></div>${ico('next',18)}</button>`).join('');
const THEMES=[['auto','Как в Telegram'],['light','Светлая'],['dark','Тёмная']];
function applyTheme(){const t=LS.get('us.theme')||'auto',r=document.documentElement;t==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',t)}
VIEWS.settings=()=>{const c=cfg();return hdr('Настройки')+
  `<div class="card"><div class="row sp-b"><div class="row">${av(ME,34)}<div><b>Я — ${esc(nm(ME))}</b><div class="muted">${esc(nm(OT()))} — ваша половинка</div></div></div><button class="btn ghost sm" data-act="swapMe">Это не я</button></div></div>
  <button class="morerow" data-act="editCfg"><span class="gl">✏️</span><div style="flex:1"><b>Имена, дата, ресторан, питомец</b><small>${esc(c.a)} и ${esc(c.b)} · «${esc(c.resto)}»</small></div>${ico('next',18)}</button>
  <div class="sec">${spark(undefined,14)} Тема</div><div class="seg">${THEMES.map(t=>`<button class="${(LS.get('us.theme')||'auto')===t[0]?'on':''}" data-act="theme" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
  <div class="sec">${spark(undefined,14)} Синхронизация вдвоём</div>
  <div class="card"><p style="margin-bottom:10px">Данные хранятся только на ваших телефонах, на сервер ничего не уходит. Чтобы увидеть записи друг друга, обменивайтесь кодом или файлом: записи объединяются, ничего не теряется.</p>
  <button class="btn block" data-act="exportCode" style="margin-bottom:10px">Скопировать код (без фото)</button>
  <button class="btn ghost block" data-act="exportFile" style="margin-bottom:10px">Сохранить файл (с фото)</button>
  <div class="fld"><label for="impT">Вставьте код от партнёра</label><textarea id="impT" rows="2" placeholder="US1.…"></textarea></div>
  <button class="btn pink block" data-act="importCode" style="margin-bottom:10px">Объединить по коду</button>
  <label class="btn ghost block">Загрузить файл<input type="file" id="impF" accept=".json,.txt,application/json,text/plain" hidden></label></div>
  <div class="sec">${spark(undefined,14)} Опасная зона</div><button class="btn ghost danger block" data-act="wipe">Стереть все данные на этом телефоне</button>`};
VIEWS.settings.after=()=>{const f=$('#impF');if(f)f.onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const n=await importText(await file.text());toast(`Объединено записей: ${n}`);render()}catch(err){toast('Не удалось прочитать файл')}}};
ACT.swapMe=()=>{ME=OT();LS.set('us.me',ME);render()};
ACT.theme=el=>{LS.set('us.theme',el.dataset.t);applyTheme();render()};
ACT.editCfg=()=>{const c=cfg();form({title:'О вас',vals:c,fields:[{k:'a',label:'Имя первого'},{k:'b',label:'Имя второго'},{k:'since',label:'Вместе с',t:'date'},{k:'resto',label:'Название ресторана-меню'},{k:'petName',label:'Имя питомца'},{k:'pet',label:'Питомец',t:'chips',opts:[['cat','Котик'],['bunny','Зайка'],['bear','Мишка']]},{k:'cur',label:'Валюта копилки',t:'chips',opts:[['₽','₽'],['$','$'],['€','€'],['₸','₸'],['Br','Br']]}],
  onSave:v=>{setCfg({a:v.a||'Он',b:v.b||'Она',since:v.since,resto:v.resto||'У нас дома',petName:v.petName||'Пушок',pet:v.pet,cur:v.cur})}})};
ACT.exportCode=async()=>{const code=await pack(JSON.stringify(exportObj(false)));if(!(await copyText(code))){openSheet(`<h2 class="sh-t">Код</h2><textarea rows="6" readonly id="codeOut">${esc(code)}</textarea><p class="muted" style="margin-top:8px">Выделите и скопируйте вручную.</p>`);$('#codeOut').select()}else toast(`Скопировано (${code.length} символов). Отправьте в чат`)};
ACT.exportFile=async()=>{const s=JSON.stringify(exportObj(true));await saveFile('my-two-'+dkey()+'.json',new Blob([s],{type:'application/json'}))};
ACT.importCode=async()=>{const t=$('#impT').value;if(!t.trim()){toast('Вставьте код');return}try{const n=await importText(t);toast(`Объединено записей: ${n}`);$('#impT').value='';render()}catch(e){toast('Код не подходит')}};
ACT.wipe=el=>{if(!el.dataset.s){el.dataset.s=1;el.textContent='Нажмите ещё раз — всё удалится';return}S={items:{}};save();LS.set('us.me','');stack=[{v:'onb',p:{}}];UI.onb=null;render(true)};

/* ---------- первый запуск ---------- */
VIEWS.onb=()=>{const o=UI.onb=UI.onb||{step:0,pet:'cat'};const u=TG()&&TG().initDataUnsafe&&TG().initDataUnsafe.user;
  const hero=`<div class="petbox">${petSVG(o.pet||'cat','happy',o.step===3?'bow':'none')}</div>`;
  if(o.step===0)return `<div class="onb">${hero}<h1>Мы вдвоём</h1><p class="lead">Маленький мир для двоих: дела, рецепты, планы, фото и милый питомец, который растёт вместе с вами.</p><button class="btn block" data-act="onbNext">Начать</button><button class="btn ghost block" data-act="onbImport">У меня есть код от второй половинки</button><button class="link" data-act="onbDemo">Посмотреть на примерах</button></div>`;
  if(o.step===1)return `<div class="onb"><h1 style="font-size:28px">Кто вы?</h1><p class="lead">Имена увидите только вы двое</p><div class="fld"><label for="onA">Первое имя</label><input id="onA" value="${esc(o.a||(u&&u.first_name)||'')}" placeholder="Маша" maxlength="20"></div><div class="fld"><label for="onB">Второе имя</label><input id="onB" value="${esc(o.b||'')}" placeholder="Дима" maxlength="20"></div><div class="fld"><label>Это телефон…</label><div class="chips" data-g="who"><button class="chip${o.who!=='b'?' on':''}" data-act="onbWho" data-w="a">первого</button><button class="chip${o.who==='b'?' on':''}" data-act="onbWho" data-w="b">второго</button></div></div><div class="fld"><label for="onS">Вместе с (необязательно)</label><input id="onS" type="date" value="${esc(o.since||'')}"></div><button class="btn block" data-act="onbNext">Дальше</button></div>`;
  if(o.step===2)return `<div class="onb"><h1 style="font-size:28px">Выберите питомца</h1><p class="lead">Он живёт у вас обоих. За дела вы получаете монетки на его корм.</p>${hero}<div class="chips" style="justify-content:center;margin:14px 0">${[['cat','Котик'],['bunny','Зайка'],['bear','Мишка']].map(([v,l])=>`<button class="chip${o.pet===v?' on':''}" data-act="onbPet" data-p="${v}">${l}</button>`).join('')}</div><div class="fld"><label for="onP">Как его зовут?</label><input id="onP" value="${esc(o.petName||'')}" placeholder="Пушок" maxlength="20"></div><button class="btn block" data-act="onbDone">Готово</button></div>`;
  return `<div class="onb"><h1 style="font-size:28px">Кто ты?</h1><p class="lead">Данные уже загружены. Выберите себя.</p><button class="btn block" data-act="onbMe" data-w="a">Я — ${esc(cfg().a)}</button><button class="btn ghost block" data-act="onbMe" data-w="b">Я — ${esc(cfg().b)}</button></div>`};
ACT.onbNext=()=>{const o=UI.onb;if(o.step===1){const a=$('#onA').value.trim(),b=$('#onB').value.trim();if(!a||!b){toast('Впишите оба имени');return}Object.assign(o,{a,b,since:$('#onS').value})}o.step++;render(true)};
ACT.onbWho=el=>{UI.onb.a=$('#onA').value;UI.onb.b=$('#onB').value;UI.onb.since=$('#onS').value;UI.onb.who=el.dataset.w;render()};
ACT.onbPet=el=>{UI.onb.petName=$('#onP').value;UI.onb.pet=el.dataset.p;render()};
ACT.onbDone=()=>{const o=UI.onb;setCfg({a:o.a,b:o.b,since:o.since||'',pet:o.pet,petName:$('#onP').value.trim()||'Пушок',ready:true});ME=o.who||'a';LS.set('us.me',ME);UI.onb=null;stack=[{v:'home',p:{}}];render(true);burst(['💖','✨'])};
ACT.onbMe=el=>{ME=el.dataset.w;LS.set('us.me',ME);UI.onb=null;stack=[{v:'home',p:{}}];render(true)};
ACT.onbDemo=async()=>{await seedDemo();UI.onb=null;stack=[{v:'home',p:{}}];render(true)};
ACT.onbImport=()=>{openSheet(`<h2 class="sh-t">Код от партнёра</h2><div class="fld"><textarea id="impT" rows="4" placeholder="US1.…"></textarea></div><div class="sh-btns"><button class="btn" id="impGo">Загрузить</button></div>`);
  $('#impGo').onclick=async()=>{try{await importText($('#impT').value);if(!get('cfg')||!cfg().ready)throw 0;closeSheet();UI.onb={step:3};render(true)}catch(e){toast('Код не подходит')}}};

/* ---------- запуск ---------- */
async function boot(){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width','0');svg.setAttribute('height','0');svg.style.position='absolute';svg.innerHTML=`<defs><clipPath id="cloud" clipPathUnits="objectBoundingBox"><path d="${cloudClipD}"/></clipPath></defs>`;document.body.appendChild(svg);
  applyTheme();await load();ME=LS.get('us.me')||'a';
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if(!cfg().ready||!LS.get('us.me')){stack=[{v:'onb',p:{}}];if(cfg().ready)UI.onb={step:3}}
  initTG();render(true);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cur().v==='home')render()});
}
boot();


</script>
</body></html>
